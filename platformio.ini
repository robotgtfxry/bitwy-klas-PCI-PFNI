; Bitwy Klas – bezprzewodowe przyciski quizowe (3× ESP32, ESP-NOW + panel WWW)
; Ten sam firmware wgrywasz na wszystkie płytki – rola (master/slave) wybiera się sama.

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.1
    bblanchon/ArduinoJson@^7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
